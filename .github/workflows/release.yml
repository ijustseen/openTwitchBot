name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Номер версии
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - name: Следующий номер
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
            if [[ ! "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Последний релиз не в формате vX.Y.Z: ${latest}" >&2
              exit 1
            fi
            tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          fi
          echo "Версия ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    name: Сборка (${{ matrix.artifact }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: OpenBot-macos
          - os: windows-latest
            artifact: OpenBot-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: python -m pip install -r requirements-build.txt pytest

      - name: Копия Tcl
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = python -c "import sys; print(sys.base_prefix)"
          $dest = "C:\openbot-tcl"
          Copy-Item -Recurse -Force (Join-Path $prefix "tcl") $dest
          if (-not (Test-Path "$dest\tcl8.6\init.tcl")) {
            throw "init.tcl не скопировался"
          }
          "TCL_LIBRARY=$dest\tcl8.6" >> $env:GITHUB_ENV
          "TK_LIBRARY=$dest\tk8.6" >> $env:GITHUB_ENV

      - name: Тесты
        run: python -m pytest

      - name: Сборка
        env:
          OPENBOT_VERSION: ${{ needs.version.outputs.tag }}
        run: python scripts/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/release/*.zip
          if-no-files-found: error

  release:
    name: Релиз на GitHub
    needs: [version, build]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      - name: Опубликовать
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            'Сборки окна OpenBot.' \
            '' \
            '- macOS: Apple Silicon. Распакуйте zip и откройте OpenBot.app. Если система пишет, что не удалось подтвердить отсутствие вредоносного ПО, нажмите «Готово», затем «Системные настройки» → «Конфиденциальность и безопасность» → «Всё равно открыть».' \
            '- Windows: распакуйте zip и запустите OpenBot.exe. SmartScreen может предупредить, что издатель неизвестен.' \
            '' \
            'Для команд на компьютере нужен Python 3.11 или новее: скрипты запускает он, а не само окно. Настройки появятся в папке data рядом с приложением.' \
            > notes.md
          shopt -s nullglob
          files=(dist/release/*.zip)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "В dist/release нет zip" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            gh release create "$TAG" "${files[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$TAG" \
              --notes-file notes.md
          else
            gh release create "$TAG" "${files[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "$TAG" \
              --notes-file notes.md
          fi
