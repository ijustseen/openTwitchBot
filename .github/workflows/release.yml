name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Сборка (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: OpenBot-macos
          - os: windows-latest
            artifact: OpenBot-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: python -m pip install -r requirements-build.txt pytest

      - name: Тесты
        run: python -m pytest

      - name: Сборка
        env:
          OPENBOT_VERSION: ${{ github.ref_name }}
        run: python scripts/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/release/*.zip
          if-no-files-found: error

  release:
    name: Релиз на GitHub
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      - name: Опубликовать
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            'Сборки окна OpenBot.' \
            '' \
            '- macOS: Apple Silicon. Распакуйте zip и откройте OpenBot.app. Если система пишет, что приложение повреждено, щёлкните его правой кнопкой и выберите «Открыть».' \
            '- Windows: распакуйте zip и запустите OpenBot.exe. SmartScreen может предупредить, что издатель неизвестен.' \
            '' \
            'Для команд на компьютере нужен Python 3.11 или новее: скрипты запускает он, а не само окно. Настройки появятся в папке data рядом с приложением.' \
            > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/release/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md
